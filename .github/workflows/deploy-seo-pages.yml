name: Deploy SEO pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unzip SEO pages from Drive
        run: |
          curl -sfL "https://drive.usercontent.google.com/download?id=1J8GWL5mMbWLYFhUxirpKpw0D4pdQenIs&export=download&confirm=t" -o seo-pages.zip
          unzip -oq seo-pages.zip
          rm seo-pages.zip

      - name: Validate contents
        run: |
          test -f sitemap.xml && test -f robots.txt && test -f bus-time-table/index.html
          test -f scripts/scrape_bussathi.py && test -f scripts/rebuild_data.py && test -f scripts/gen_seo_pages.py
          test $(ls bus-time-table/*.html | wc -l) -gt 300
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bus-time-table scripts sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add 342 SEO bus-time-table pages + pipeline scripts + sitemap.xml + robots.txt"
            git push
          fi
