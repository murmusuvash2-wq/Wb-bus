name: Apply free geocode results
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply stop_coords + nearest patch
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          B64 = """"""
          Path("data").mkdir(exist_ok=True)
          Path("data/stop_coords.json").write_bytes(gzip.decompress(base64.b64decode(B64)))
          coords = json.loads(Path("data/stop_coords.json").read_text())
          print("Garhbeta coords", coords.get("Garhbeta"))
          patch = json.loads("""{\"Garhbeta\": {\"name\": \"GARHBETA\", \"code\": \"GBA\", \"km\": 0.0}, \"Beliatore\": {\"name\": \"KALISEN\", \"code\": \"KISN\", \"km\": 16.1}, \"Khatra\": {\"name\": \"BANKURA\", \"code\": \"BQA\", \"km\": 35.7}, \"Ranibandh\": {\"name\": \"GIDNI\", \"code\": \"GII\", \"km\": 42.4}, \"Bandwan\": {\"name\": \"GALUDIH\", \"code\": \"GUD\", \"km\": 17.5}, \"Barabazar\": {\"name\": \"BIRAMDIH\", \"code\": \"BRMD\", \"km\": 16.6}, \"Daspur\": {\"name\": \"PANSKURA\", \"code\": \"PKU\", \"km\": 19.0}, \"Ghatal\": {\"name\": \"PANSKURA\", \"code\": \"PKU\", \"km\": 18.0}, \"Khirpai\": {\"name\": \"CHANDRAKONA RD\", \"code\": \"CDGR\", \"km\": 12.0}, \"Arambagh\": {\"name\": \"ARAMBAGH\", \"code\": \"AMBG\", \"km\": 0.5}, \"Sarenga\": {\"name\": \"GARHBETA\", \"code\": \"GBA\", \"km\": 32.1}}""")
          data = json.loads(Path("data/busjatri_data.json").read_text(encoding="utf-8"))
          stops = data.get("stops") or {}
          for name, ns in patch.items():
              if name in stops and ns:
                  stops[name]["nearest_station"] = ns
                  print("patched", name, "->", ns)
          data["stops"] = stops
          Path("data/busjatri_data.json").write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print("DONE Garhbeta", stops.get("Garhbeta", {}).get("nearest_station"))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stop_coords.json data/busjatri_data.json
          git diff --staged --quiet || git commit -m "data: apply free geocode — Garhbeta GBA 0km + 25 suspects"
          git push
