name: Regenerate SEO Pages

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'data/busjatri_data.json'
      - 'scripts/apply_seo_redesign.py'
      - '.github/workflows/regenerate-seo-pages.yml'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply SEO redesign patch
        run: python3 scripts/apply_seo_redesign.py

      - name: Regenerate SEO pages
        run: python3 scripts/gen_seo_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_seo_pages.py bus-time-table/ sitemap.xml
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: regenerate SEO pages with compact departure-board design [skip ci]"
          git push
