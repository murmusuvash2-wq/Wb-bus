name: Deploy data v3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download and unzip from Drive
        run: |
          curl -sfL "https://drive.usercontent.google.com/download?id=1VIbKvasBfFP1oUVE3NN0B2IT4M8MagxP&export=download&confirm=t" -o files.zip
          unzip -oq files.zip
          rm files.zip

      - name: Validate data
        run: |
          test -f data/busjatri_data.json
          python3 -c "import json; d=json.load(open('data/busjatri_data.json')); assert len(d['buses'])>=3900; assert len(set(b['id'] for b in d['buses']))==len(d['buses']); assert isinstance(d['routes'],dict) and isinstance(d['stops'],dict); print('OK:', len(d['buses']), 'buses', len(d['routes']), 'routes')"

      - name: Apply via system patches
        run: python3 scripts/patches/apply_via.py

      - name: Apply UI polish patches
        run: |
          python3 scripts/patches/apply_ui_polish.py
          python3 scripts/patches/fix_places.py
          python3 scripts/patches/fix_animation.py

      - name: Regenerate SEO pages
        run: |
          rm -rf bus-time-table
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          test $(ls bus-time-table/*.html | wc -l) -gt 1500
          test $(ls bus-time-table/ | grep -c '\-via\-') -gt 50
          cat scripts/patches/rx_parts/rx_p1 scripts/patches/rx_parts/rx_p2 scripts/patches/rx_parts/rx_p3 scripts/patches/rx_parts/rx_p4 scripts/patches/rx_parts/rx_p5 scripts/patches/rx_parts/rx_p6 > scripts/patches/redesign_seo_index.py
          python3 scripts/patches/redesign_seo_index.py
          test $(stat -c%s bus-time-table/index.html) -lt 500000
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data scripts css js bus-time-table sitemap.xml robots.txt data/app-index.json data/bus-details.json
          if git diff --cached -quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data + via + UI + animation + SEO index redesign: regenerate"
            git push
          fi
