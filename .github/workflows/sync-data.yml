name: Sync app.js from Drive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download app.js from Drive
        run: |
          curl -sfL "https://drive.usercontent.google.com/download?id=1asUs3ZElYy8WK9FMeVsbmsEyZGg7CIRb&export=download&confirm=t" -o js/app.js

      - name: Validate
        run: node --check js/app.js && echo "app.js syntax OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync app.js from Drive (stoppage search, countdown, railway stations, embed removed)"
            git push
          fi
