name: Sync data from Drive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download files from Google Drive
        run: |
          curl -sL "https://drive.google.com/uc?export=download&id=1ZERVCdRkkqLZxydV7Ka-ggmHZesLszJC" -o data/busjatri_data.json
          curl -sL "https://drive.google.com/uc?export=download&id=1r-DtUa_NwaBANkTnv36IveHOFljCmfWC" -o js/app.js

      - name: Validate downloads
        run: |
          python3 -c "import json; d=json.load(open('data/busjatri_data.json')); bs=d['buses']; assert isinstance(bs, list) and len(bs) > 1000, 'bad bus data'; print('data OK:', len(bs), 'buses,', d['meta']['version'])"
          node --check js/app.js && echo "app.js syntax OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/busjatri_data.json js/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data (1442 buses, +124 from wbbustime/whereismybus) + fix Show-all-stops bug"
            git push
          fi
